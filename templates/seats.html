    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .screen-container {
            width: 100vw;
            background-color: #2b2b2b;
            border-radius: 0;
            box-shadow: none;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 20px;
            color: #eee;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
            margin-bottom: 15px;
            position: relative;
            background-color: #c15407;
        }

        .header h2 {
            margin: 0;
            color: white;
            font-size: 2em;
            font-weight: 700;
        }

        .header p {
            margin: 3px 0 0;
            font-size: 1.1em;
            color: #ffffff;
            font-weight: 400;
        }

        .close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2.2em;
            color: #ccc;
            cursor: pointer;
            text-decoration: none;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .close-button:hover {
            color: #fff;
        }

        .screen-indicator {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .screen-indicator p {
            font-size: 1.3em;
            color: #eee;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .screen-curve {
            width: 80%;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            margin: 0 auto;
            transform: scaleY(0.1);
            box-sizing: border-box;
            background-color: white;
        }

        .seating-layout {
            display: flex;
            justify-content: center;
            gap: 100px;
            flex-grow: 1;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: nowrap;
            overflow-y: hidden;
            overflow-x: auto;
            padding-bottom: 5px;
        }


        .seat-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .seat-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .row-number {
            width: 25px;
            text-align: right;
            font-size: 0.9em;
            color: #ccc;
            margin-right: 5px;
            flex-shrink: 0;
            font-weight: 500;
        }

        .seat {
            width: 38px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: 500;
            color: transparent;
            border: 1px solid transparent;
            flex-shrink: 0;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }

        .seat.type-30c {
            background-color: #8A2BE2;
        }

        .seat.type-50c {
            background-color: #ff8400;
        }

        .seat.type-60c {
            background-color: #ff00a2;
        }

        .seat:hover {
            transform: scale(1.05);
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .middle-section-gap {
            width: 28px;
            height: 40px;
            background-color: transparent;
            flex-shrink: 0;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: auto;
            margin-bottom: 0;
            flex-wrap: wrap;
            padding-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 400;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
    </style>
</head>
